<!DOCTYPE html>
<html lang="tr" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hafıza Bahçesi</title>
<meta name="description" content="Hafıza Bahçesi — eşleri bul, sırayı kaptırma. İki kişilik ya da bota karşı oynanan hafıza oyunu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EFDC;
  --bg-2:#DDE7CB;
  --panel:#FFFDF4;
  --ink:#22331D;
  --ink-soft:#5C6B52;
  --line:#C9D5B4;
  --accent:#DB6B33;
  --teal:#2E7D6C;
  --sun:#EFBA2A;
  --back-1:#2E7D6C;
  --back-2:#246255;
  --shadow:0 10px 0 rgba(34,51,29,.10);
  --radius:18px;
}
html[data-theme="night"]{
  --bg:#152230;
  --bg-2:#101A25;
  --panel:#1E2F3D;
  --ink:#EDF3E6;
  --ink-soft:#A9BCAE;
  --line:#2C4356;
  --accent:#F2884A;
  --teal:#3FA28C;
  --sun:#F2C230;
  --back-1:#35707F;
  --back-2:#25505E;
  --shadow:0 10px 0 rgba(0,0,0,.28);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1100px 620px at 50% -12%, var(--bg) 0%, var(--bg-2) 100%) fixed;
  color:var(--ink);
  font-family:"Karla","Segoe UI",Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,.display{font-family:"Baloo 2","Trebuchet MS",Verdana,sans-serif;font-weight:800;line-height:1.05;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}

.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:clamp(14px,3vw,34px) clamp(12px,3vw,28px) 40px}
.screen{width:100%;max-width:980px;display:none}
.screen.on{display:block}

/* ---------- Menü ---------- */
.langbar{display:flex;justify-content:flex-end;margin-bottom:10px}
.seg.lang button{padding:6px 13px;font-size:13.5px;border-radius:999px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-bottom:26px}
.fan{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin-bottom:6px;height:118px}
.fan .chip{
  width:86px;height:104px;border-radius:14px;border:3px solid var(--ink);
  background:linear-gradient(160deg,var(--back-1),var(--back-2));
  box-shadow:var(--shadow);display:grid;place-items:center;overflow:hidden;
}
.fan .chip:nth-child(1){transform:rotate(-9deg) translateY(6px)}
.fan .chip:nth-child(3){transform:rotate(9deg) translateY(6px)}
.fan .chip.open{background:var(--panel)}
.fan .chip svg{width:74px;height:74px}
.fan .chip.reveal{animation:pop .5s cubic-bezier(.2,1.3,.4,1) .35s both}
@keyframes pop{0%{transform:rotate(0) scale(.7)}100%{transform:rotate(0) scale(1)}}

h1{font-size:clamp(34px,7vw,58px);letter-spacing:-.5px}
.tagline{color:var(--ink-soft);max-width:44ch;margin:0 auto;font-size:17px}

.panel{
  background:var(--panel);border:3px solid var(--ink);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:clamp(16px,3vw,26px);
}
.rows{display:grid;gap:20px}
.row{display:grid;gap:10px}
.row>.label{font-weight:700;font-size:14px;color:var(--ink-soft)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.pair{grid-template-columns:1fr}}

input[type=text]{
  width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);
  background:transparent;color:var(--ink);font:inherit;
}
input[type=text]:focus{border-color:var(--accent);outline:none}
input[type=text]:disabled{opacity:.45}

.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{
  border:2px solid var(--line);background:transparent;border-radius:999px;
  padding:9px 16px;font-weight:700;font-size:15px;transition:transform .12s ease;
}
.seg button:hover{transform:translateY(-1px)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.seg.sizes button{min-width:92px;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.2;padding:8px 14px}
.seg.sizes .n{font-family:"Baloo 2",sans-serif;font-size:19px}
.seg.sizes .g{font-size:12px;opacity:.7}
.hidden{display:none !important}

.start{
  margin-top:24px;width:100%;border:3px solid var(--ink);border-radius:14px;
  background:var(--accent);color:#fff;font-family:"Baloo 2",sans-serif;font-weight:800;
  font-size:22px;padding:14px;box-shadow:var(--shadow);transition:transform .12s ease,box-shadow .12s ease;
}
.start:hover{transform:translateY(-2px);box-shadow:0 12px 0 rgba(34,51,29,.14)}
.start:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(34,51,29,.14)}

/* ---------- Oyun ---------- */
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin-bottom:clamp(12px,2.5vw,20px)}
.pad{
  background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:10px 14px;
  display:flex;align-items:center;gap:12px;min-width:0;
}
.pad.right{justify-content:flex-end;text-align:right}
.pad.active{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.pad .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad .sc{font-family:"Baloo 2",sans-serif;font-size:30px;line-height:1}
.pad .tm{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pad .tm.low{color:var(--accent);font-weight:700}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 6px}
.turn{font-family:"Baloo 2",sans-serif;font-size:17px;white-space:nowrap}
.mid .quit{background:none;border:none;font-size:13px;color:var(--ink-soft);text-decoration:underline;padding:2px}
@media(max-width:600px){
  .hud{grid-template-columns:1fr 1fr;grid-template-areas:"l r" "m m"}
  .pad.left{grid-area:l}.pad.right{grid-area:r}.mid{grid-area:m}
  .pad .sc{font-size:24px}
}

.board{display:grid;gap:clamp(7px,1.4vw,13px);margin:0 auto;width:100%}
.card{
  position:relative;aspect-ratio:1;border:none;background:none;padding:0;
  perspective:900px;-webkit-tap-highlight-color:transparent;
}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.3,.9,.3,1)}
.card.flip .inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:14px;border:3px solid var(--ink);display:grid;place-items:center;overflow:hidden;
}
.back{background:linear-gradient(160deg,var(--back-1),var(--back-2))}
.front{background:var(--panel);transform:rotateY(180deg)}
.front svg,.back svg{width:86%;height:86%;display:block}
.card.done .inner{transform:rotateY(180deg) scale(.93)}
.card.done .front{border-color:var(--teal);box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--teal) 30%,transparent)}
.card.done{pointer-events:none}
.card.shake .inner{animation:shake .4s}
@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-5px)}75%{transform:rotateY(180deg) translateX(5px)}}
.card:not(.flip):hover .inner{transform:translateY(-4px)}

/* ---------- Bitiş ---------- */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(3px);display:none;place-items:center;padding:20px;z-index:20}
.overlay.on{display:grid}
.result{background:var(--panel);border:3px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;text-align:center;max-width:420px;width:100%}
.result h2{font-size:34px;margin-bottom:6px}
.result .sub{color:var(--ink-soft);margin-bottom:18px}
.result .tally{display:flex;justify-content:center;gap:26px;margin-bottom:22px;font-family:"Baloo 2",sans-serif;font-size:22px}
.result .tally span{display:block;font-size:13px;font-family:"Karla",sans-serif;color:var(--ink-soft)}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.acts button{border:3px solid var(--ink);border-radius:12px;padding:11px 18px;font-family:"Baloo 2",sans-serif;font-size:17px;background:transparent}
.acts .primary{background:var(--accent);color:#fff}

footer{margin-top:26px;font-size:13px;color:var(--ink-soft);text-align:center}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="wrap">

<!-- ============ MENÜ ============ -->
<section class="screen on" id="menu">
  <div class="langbar">
    <div class="seg lang" id="segLang" aria-label="Dil / Language">
      <button data-v="tr" aria-pressed="true">Türkçe</button>
      <button data-v="en" aria-pressed="false">English</button>
    </div>
  </div>
  <div class="hero">
    <div class="fan" aria-hidden="true">
      <div class="chip"><svg viewBox="0 0 60 72"><path d="M12 14h36M12 26h36M12 38h36M12 50h36" stroke="rgba(255,255,255,.22)" stroke-width="3" stroke-linecap="round"/></svg></div>
      <div class="chip open reveal" id="heroCard"></div>
      <div class="chip"><svg viewBox="0 0 60 72"><path d="M12 14h36M12 26h36M12 38h36M12 50h36" stroke="rgba(255,255,255,.22)" stroke-width="3" stroke-linecap="round"/></svg></div>
    </div>
    <h1 data-i18n="title">Hafıza Bahçesi</h1>
    <p class="tagline" data-i18n="tagline">Kartları çevir, eşleri bul. Doğru bilen tekrar oynar, yanılan sırayı kaptırır.</p>
  </div>

  <div class="panel">
    <div class="rows">
      <div class="row">
        <div class="label" data-i18n="lblDeck">Tema</div>
        <div class="seg" id="segDeck">
          <button data-v="animal" aria-pressed="true" data-i18n="deckAnimals">Hayvanlar</button>
          <button data-v="plant" aria-pressed="false" data-i18n="deckPlants">Bitkiler</button>
          <button data-v="mixed" aria-pressed="false" data-i18n="deckMixed">Karışık</button>
        </div>
      </div>

      <div class="row">
        <div class="label" data-i18n="lblPlayers">Oyuncular</div>
        <div class="pair">
          <input type="text" id="p1" maxlength="14" placeholder="1. oyuncu" autocomplete="off">
          <input type="text" id="p2" maxlength="14" placeholder="2. oyuncu" autocomplete="off">
        </div>
      </div>

      <div class="row">
        <div class="label" data-i18n="lblOpponent">Rakip</div>
        <div class="seg" id="segMode">
          <button data-v="two" aria-pressed="true" data-i18n="two">İki oyuncu</button>
          <button data-v="bot" aria-pressed="false" data-i18n="vsBot">Bota karşı</button>
        </div>
      </div>

      <div class="row hidden" id="rowBot">
        <div class="label" data-i18n="lblBotMemory">Botun hafızası</div>
        <div class="seg" id="segBot">
          <button data-v="0" aria-pressed="true" data-i18n="forgetful">Unutkan</button>
          <button data-v="1" aria-pressed="false" data-i18n="remembers">Gördüğünü hatırlar</button>
        </div>
      </div>

      <div class="row">
        <div class="label" data-i18n="lblTime">Süre</div>
        <div class="seg" id="segTime">
          <button data-v="0" aria-pressed="true" data-i18n="free">Serbest</button>
          <button data-v="1" aria-pressed="false" data-i18n="race">Süre yarışı</button>
        </div>
      </div>

      <div class="row">
        <div class="label" data-i18n="lblSize">Kart sayısı</div>
        <div class="seg sizes" id="segSize"></div>
      </div>

      <div class="row">
        <div class="pair">
          <div>
            <div class="label" style="margin-bottom:8px" data-i18n="lblTheme">Tema</div>
            <div class="seg" id="segTheme">
              <button data-v="day" aria-pressed="true" data-i18n="day">Gündüz</button>
              <button data-v="night" aria-pressed="false" data-i18n="night">Gece</button>
            </div>
          </div>
          <div>
            <div class="label" style="margin-bottom:8px" data-i18n="lblSound">Ses</div>
            <div class="seg" id="segSound">
              <button data-v="1" aria-pressed="true" data-i18n="soundOn">Açık</button>
              <button data-v="0" aria-pressed="false" data-i18n="soundOff">Kapalı</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <button class="start" id="startBtn" data-i18n="start">Oyunu başlat</button>
  </div>

  <footer data-i18n="footer">Klavyeyle de oynanır: kartlar arasında Tab, çevirmek için Enter.</footer>
</section>

<!-- ============ OYUN ============ -->
<section class="screen" id="game">
  <div class="hud">
    <div class="pad left" id="pad0">
      <div>
        <div class="nm" id="nm0">1. oyuncu</div>
        <div class="tm" id="tm0"></div>
      </div>
      <div class="sc" id="sc0">0</div>
    </div>
    <div class="mid">
      <div class="turn" id="turnTxt">Sıra sende</div>
      <button class="quit" id="quitBtn" data-i18n="quit">Menüye dön</button>
    </div>
    <div class="pad right" id="pad1">
      <div class="sc" id="sc1">0</div>
      <div>
        <div class="nm" id="nm1">2. oyuncu</div>
        <div class="tm" id="tm1"></div>
      </div>
    </div>
  </div>
  <div class="board" id="board"></div>
</section>

</div>

<div class="overlay" id="overlay">
  <div class="result">
    <h2 id="resTitle">Kazanan</h2>
    <p class="sub" id="resSub"></p>
    <div class="tally">
      <div id="resS0">0<span id="resN0">1. oyuncu</span></div>
      <div id="resS1">0<span id="resN1">2. oyuncu</span></div>
    </div>
    <div class="acts">
      <button class="primary" id="againBtn" data-i18n="again">Yeniden oyna</button>
      <button id="menuBtn" data-i18n="menu">Menü</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   Hayvanlar — hepsi elle çizilmiş SVG, dış dosya yok
   ============================================================ */
const eyes = (lx, rx, y, r = 5.2) => `
  <ellipse cx="${lx}" cy="${y}" rx="${r*.72}" ry="${r}" fill="#2B2318"/>
  <ellipse cx="${rx}" cy="${y}" rx="${r*.72}" ry="${r}" fill="#2B2318"/>
  <circle cx="${lx+1.4}" cy="${y-2}" r="1.3" fill="#fff"/>
  <circle cx="${rx+1.4}" cy="${y-2}" r="1.3" fill="#fff"/>`;

const smile = (cx, y, w = 6) =>
  `<path d="M${cx-w} ${y} q${w} ${w*.8} ${w*2} 0" stroke="#6B4A2C" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;

const ANIMALS = [
  { n:"Kedi", bg:"#FBE6CC", s:`
    <path d="M23 46 L27 17 L46 31 Z" fill="#E98C36"/><path d="M77 46 L73 17 L54 31 Z" fill="#E98C36"/>
    <path d="M28 40 L30 26 L39 33 Z" fill="#F7BE9E"/><path d="M72 40 L70 26 L61 33 Z" fill="#F7BE9E"/>
    <ellipse cx="50" cy="57" rx="29" ry="26" fill="#F2A24E"/>
    <ellipse cx="50" cy="66" rx="15" ry="11" fill="#FDF1DF"/>
    ${eyes(38,62,53)}
    <path d="M45.5 61 h9 L50 66 Z" fill="#C4553F"/>
    <path d="M50 66 v3" stroke="#8A5A33" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M50 69 q-4 4 -7.5 .5 M50 69 q4 4 7.5 .5" stroke="#8A5A33" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M18 60 h8 M18 67 h8 M82 60 h-8 M82 67 h-8" stroke="#C08246" stroke-width="1.5" stroke-linecap="round"/>`},

  { n:"Köpek", bg:"#F3E3CE", s:`
    <ellipse cx="24" cy="55" rx="11" ry="19" fill="#8A5A38"/><ellipse cx="76" cy="55" rx="11" ry="19" fill="#8A5A38"/>
    <ellipse cx="50" cy="54" rx="28" ry="26" fill="#C4884F"/>
    <ellipse cx="50" cy="66" rx="17" ry="13" fill="#F3DDC0"/>
    <ellipse cx="34" cy="45" rx="10" ry="8" fill="#A96F41"/>
    ${eyes(38,62,50)}
    <ellipse cx="50" cy="62" rx="5.5" ry="4.2" fill="#3A2A1C"/>
    <path d="M50 66 v4" stroke="#6B4A2C" stroke-width="1.8" stroke-linecap="round"/>
    ${smile(50,70,6)}`},

  { n:"Tilki", bg:"#FBDFC8", s:`
    <path d="M20 44 L24 14 L45 30 Z" fill="#D9622B"/><path d="M80 44 L76 14 L55 30 Z" fill="#D9622B"/>
    <path d="M25 38 L27 23 L37 32 Z" fill="#33251C"/><path d="M75 38 L73 23 L63 32 Z" fill="#33251C"/>
    <path d="M50 30 C74 30 80 46 78 58 C76 72 64 82 50 82 C36 82 24 72 22 58 C20 46 26 30 50 30 Z" fill="#EE7B34"/>
    <path d="M50 52 C60 52 66 62 64 70 C62 78 56 82 50 82 C44 82 38 78 36 70 C34 62 40 52 50 52 Z" fill="#FDF3E6"/>
    ${eyes(38,62,50)}
    <ellipse cx="50" cy="66" rx="5" ry="4" fill="#2B2318"/>
    <path d="M50 70 v3" stroke="#8A5A33" stroke-width="1.6" stroke-linecap="round"/>
    ${smile(50,73,5)}`},

  { n:"Ayı", bg:"#EFDFCB", s:`
    <circle cx="25" cy="30" r="12" fill="#7A5237"/><circle cx="75" cy="30" r="12" fill="#7A5237"/>
    <circle cx="25" cy="30" r="6" fill="#B58562"/><circle cx="75" cy="30" r="6" fill="#B58562"/>
    <ellipse cx="50" cy="55" rx="30" ry="27" fill="#8C6244"/>
    <ellipse cx="50" cy="66" rx="16" ry="12" fill="#D9BB98"/>
    ${eyes(39,61,50)}
    <ellipse cx="50" cy="62" rx="6" ry="4.6" fill="#33241A"/>
    <path d="M50 67 v4" stroke="#5A3D28" stroke-width="1.8" stroke-linecap="round"/>
    ${smile(50,71,6)}`},

  { n:"Panda", bg:"#E6E9EC", s:`
    <circle cx="24" cy="28" r="12" fill="#2B2B2B"/><circle cx="76" cy="28" r="12" fill="#2B2B2B"/>
    <ellipse cx="50" cy="55" rx="30" ry="27" fill="#FBFBFB"/>
    <ellipse cx="36" cy="50" rx="10" ry="12" fill="#2B2B2B" transform="rotate(-18 36 50)"/>
    <ellipse cx="64" cy="50" rx="10" ry="12" fill="#2B2B2B" transform="rotate(18 64 50)"/>
    <circle cx="37" cy="51" r="4" fill="#fff"/><circle cx="63" cy="51" r="4" fill="#fff"/>
    <circle cx="37.8" cy="50" r="2.2" fill="#1A1A1A"/><circle cx="63.8" cy="50" r="2.2" fill="#1A1A1A"/>
    <ellipse cx="50" cy="64" rx="6" ry="4.4" fill="#2B2B2B"/>
    <path d="M44 72 q6 6 12 0" stroke="#2B2B2B" stroke-width="2" fill="none" stroke-linecap="round"/>`},

  { n:"Koala", bg:"#E4E7E5", s:`
    <circle cx="20" cy="42" r="15" fill="#9AA5A8"/><circle cx="80" cy="42" r="15" fill="#9AA5A8"/>
    <circle cx="20" cy="42" r="8" fill="#C9B4B8"/><circle cx="80" cy="42" r="8" fill="#C9B4B8"/>
    <ellipse cx="50" cy="54" rx="26" ry="26" fill="#A9B4B7"/>
    ${eyes(40,60,50,4.6)}
    <path d="M42 62 q8 -5 16 0 q0 10 -8 12 q-8 -2 -8 -12 Z" fill="#3B3B40"/>
    ${smile(50,76,5)}`},

  { n:"Aslan", bg:"#FBEBC8", s:`
    <g fill="#C97B2C">
      <circle cx="50" cy="20" r="11"/><circle cx="22" cy="34" r="11"/><circle cx="78" cy="34" r="11"/>
      <circle cx="16" cy="58" r="11"/><circle cx="84" cy="58" r="11"/><circle cx="28" cy="78" r="11"/>
      <circle cx="72" cy="78" r="11"/><circle cx="50" cy="86" r="11"/>
    </g>
    <circle cx="50" cy="53" r="25" fill="#F2B558"/>
    ${eyes(40,60,49)}
    <ellipse cx="50" cy="60" rx="15" ry="10" fill="#FBE4C0"/>
    <path d="M45.5 58 h9 L50 63 Z" fill="#A8542C"/>
    <path d="M50 63 v3" stroke="#8A5A33" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M50 66 q-4 4 -7 .5 M50 66 q4 4 7 .5" stroke="#8A5A33" stroke-width="1.6" fill="none" stroke-linecap="round"/>`},

  { n:"Kaplan", bg:"#FBE2C4", s:`
    <circle cx="24" cy="26" r="10" fill="#E07C2B"/><circle cx="76" cy="26" r="10" fill="#E07C2B"/>

/* --- ışın biçiminde taç yaprak yerleştirici --- */
const ray = (cx, cy, R, n, rx, ry, fill, phase = 0) =>
  Array.from({ length: n }, (_, i) => {
    const a = phase + i * 360 / n, r = a * Math.PI / 180;
    const x = (cx + R * Math.cos(r)).toFixed(1), y = (cy + R * Math.sin(r)).toFixed(1);
    return `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${a.toFixed(0)} ${x} ${y})" fill="${fill}"/>`;
  }).join("");

let actx = null, soundOn = true;
function tone(freq, dur, type = "sine", gain = .18, delay = 0) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}
const sMatch = () => { tone(660, .16, "triangle"); tone(880, .22, "triangle", .16, .1); };
const sMiss  = () => { tone(190, .22, "sawtooth", .1); };
const sFlip  = () => { tone(440, .07, "square", .06); };
const sWin   = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .3, "triangle", .16, i * .13));
const sTick  = () => { tone(300, .06, "sine", .07); };

function newGame() {
  const conf = SIZES[cfg.size];
  const pairs = conf.cards / 2;
  const deck = [];
  const picked = [...DECKS[cfg.deck]].sort(() => Math.random() - .5).slice(0, pairs);
  picked.forEach((a, i) => { deck.push({ id: i, a }); deck.push({ id: i, a }); });
  deck.sort(() => Math.random() - .5);

  S = {
    deck, conf, id: (window.__gid = (window.__gid || 0) + 1),
    names: [cfg.p1 || T("p1"), cfg.bot ? T("bot") : (cfg.p2 || T("p2"))],
    open: [], matched: 0, turn: 0, scores: [0, 0],
    busy: false, over: false,
    seen: new Map(),
    time: [conf.time, conf.time],
    lastTick: performance.now()
  };

  $("nm0").textContent = S.names[0];
  $("nm1").textContent = S.names[1];
  $("sc0").textContent = "0";
  $("sc1").textContent = "0";

  const board = $("board");
  board.innerHTML = deck.map((c, i) => `
    <button class="card" data-i="${i}" aria-label="${T('closed')}">
      <div class="inner">
        <div class="face back">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path d="M50 22 C64 22 74 34 74 48 C74 64 62 76 50 82 C38 76 26 64 26 48 C26 34 36 22 50 22 Z" fill="rgba(255,255,255,.14)"/>
            <path d="M50 26 v52" stroke="rgba(255,255,255,.30)" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M50 44 l-12 -8 M50 56 l-12 -8 M50 44 l12 -8 M50 56 l12 -8" stroke="rgba(255,255,255,.30)" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="face front">${svgWrap(c.a)}</div>
      </div>
    </button>`).join("");

  layout();
  updateHUD();
  $("overlay").classList.remove("on");
  $("menu").classList.remove("on");
  $("game").classList.add("on");
  S.lastTick = performance.now();
  const id = S.id;
  requestAnimationFrame(t => tick(t, id));
}

function layout() {
  if (!S) return;
  const w = window.innerWidth;
  const max = w < 520 ? 4 : w < 780 ? 6 : 8;
  const cols = Math.min(S.conf.cols, max);
  const board = $("board");
  board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  board.style.maxWidth = Math.min(960, cols * 132) + "px";
}
addEventListener("resize", layout);

function fmt(s) {
  s = Math.max(0, Math.ceil(s));
  return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
}

function updateHUD() {
  $("sc0").textContent = S.scores[0];
  $("sc1").textContent = S.scores[1];
  $("pad0").classList.toggle("active", S.turn === 0 && !S.over);
  $("pad1").classList.toggle("active", S.turn === 1 && !S.over);
  $("turnTxt").textContent = T("turn") + S.names[S.turn];
  for (const i of [0, 1]) {
    const el = $("tm" + i);
    el.textContent = cfg.timed ? fmt(S.time[i]) : "";
    el.classList.toggle("low", cfg.timed && S.time[i] <= 15);
  }
}

function tick(now, id) {
  if (!S || S.over || S.id !== id) return;
  const dt = (now - S.lastTick) / 1000;
  S.lastTick = now;
  if (cfg.timed) {
    const before = Math.ceil(S.time[S.turn]);
    S.time[S.turn] -= dt;
    const after = Math.ceil(S.time[S.turn]);
    if (after !== before && after <= 5 && after > 0) sTick();
    if (S.time[S.turn] <= 0) {
      S.time[S.turn] = 0;
      finish(1 - S.turn, "timeUp");
      return;
    }
    updateHUD();
  }
  requestAnimationFrame(t => tick(t, id));
}

/* --- kart çevirme --- */
$("board").addEventListener("click", e => {
  const b = e.target.closest(".card"); if (!b) return;
  if (cfg.bot && S.turn === 1) return;
  reveal(+b.dataset.i);
});

async function reveal(i) {
  if (!S || S.busy || S.over) return;
  const el = $("board").children[i];
  if (el.classList.contains("flip") || el.classList.contains("done")) return;

  el.classList.add("flip");
  el.setAttribute("aria-label", animalName(S.deck[i].a));
  sFlip();
  S.seen.set(i, S.deck[i].id);
  S.open.push(i);

  if (S.open.length === 2) await resolve();
}

async function resolve() {
  S.busy = true;
  const [i, j] = S.open;
  const kids = $("board").children;
  await sleep(600);

  if (S.deck[i].id === S.deck[j].id) {
    kids[i].classList.add("done"); kids[j].classList.add("done");
    S.seen.delete(i); S.seen.delete(j);
    S.scores[S.turn]++; S.matched++;
    sMatch();
  } else {
    kids[i].classList.add("shake"); kids[j].classList.add("shake");
    sMiss();
    await sleep(420);
    kids[i].classList.remove("flip", "shake"); kids[j].classList.remove("flip", "shake");
    kids[i].setAttribute("aria-label", T("closed")); kids[j].setAttribute("aria-label", T("closed"));
    S.turn = 1 - S.turn;
  }
  S.open = [];
  S.busy = false;
  updateHUD();

  if (S.matched === S.conf.cards / 2) {
    const w = S.scores[0] === S.scores[1] ? -1 : (S.scores[0] > S.scores[1] ? 0 : 1);
    finish(w, "allFound");
    return;
  }
  if (cfg.bot && S.turn === 1) botTurn();
}

/* --- bot --- */
async function botTurn() {
  await sleep(700);
  if (!S || S.over) return;
  const kids = $("board").children;
  const free = [...S.deck.keys()].filter(i =>
    !kids[i].classList.contains("done") && !kids[i].classList.contains("flip"));
  if (free.length < 2) return;

  let a = null, b = null;

  if (cfg.smart) {
    const byId = new Map();
    for (const i of free) {
      const id = S.seen.get(i);
      if (id === undefined) continue;
      if (byId.has(id)) { a = byId.get(id); b = i; break; }
      byId.set(id, i);
    }
  }
  if (a === null) {
    const unknown = cfg.smart ? free.filter(i => !S.seen.has(i)) : free;
    const pool = unknown.length ? unknown : free;
    a = pool[Math.floor(Math.random() * pool.length)];
    if (cfg.smart) {
      const want = S.deck[a].id;
      b = free.find(i => i !== a && S.seen.get(i) === want) ?? null;
    }
    if (b === null || b === undefined) {
      const rest = free.filter(i => i !== a);
      b = rest[Math.floor(Math.random() * rest.length)];
    }
  }

  await reveal(a);
  if (S.over) return;
  await sleep(600);
  if (S.over) return;
  await reveal(b);
}

/* --- bitiş --- */
function finish(winner, subKey) {
  S.over = true;
  updateHUD();
  $("pad0").classList.remove("active"); $("pad1").classList.remove("active");
  $("resTitle").textContent = winner === -1 ? T("draw") : I18N[lang].win(S.names[winner]);
  $("resSub").textContent = T(subKey);
  $("resN0").textContent = S.names[0];
  $("resN1").textContent = S.names[1];
  $("resS0").childNodes[0].nodeValue = S.scores[0];
  $("resS1").childNodes[0].nodeValue = S.scores[1];
  if (winner !== -1) sWin(); else sMiss();
  $("overlay").classList.add("on");
  $("againBtn").focus();
}

/* --- ekran geçişleri --- */
$("startBtn").addEventListener("click", () => {
  cfg.p1 = $("p1").value.trim();
  cfg.p2 = $("p2").value.trim();
  newGame();
});
$("againBtn").addEventListener("click", newGame);
$("menuBtn").addEventListener("click", toMenu);
$("quitBtn").addEventListener("click", toMenu);

function toMenu() {
  if (S) S.over = true;
  $("overlay").classList.remove("on");
  $("game").classList.remove("on");
  $("menu").classList.add("on");
}

addEventListener("keydown", e => {
  if (e.key === "Escape" && $("game").classList.contains("on")) toMenu();
  if (e.key === "Enter" && $("menu").classList.contains("on") && document.activeElement.tagName === "INPUT") $("startBtn").click();
});
</script>
